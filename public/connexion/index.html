<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Connexion — GameVault</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --surface: #141821;
        --border: #232a36;
        --text: #e7ebf3;
        --muted: #8b95a7;
        --accent: #7c9cff;
        --danger: #ff7b7b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 32px 28px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        text-align: center;
      }
      h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
      h1 span { color: var(--accent); }
      p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
      #button { display: flex; justify-content: center; min-height: 44px; }
      #message { margin: 16px 0 0; min-height: 1.5em; font-size: 14px; }
      #message.error { color: var(--danger); }
    </style>
  </head>
  <body>
    <main>
      <h1>Game<span>Vault</span></h1>
      <p>Collection privée. Connectez-vous avec votre compte Google.</p>
      <div id="button"></div>
      <p id="message" role="status"></p>
    </main>
    <script>
      const message = document.getElementById("message");
      const next = new URLSearchParams(location.search).get("next");
      const target = next && next.startsWith("/") && !next.startsWith("//") ? next : "/";

      function show(text, isError) {
        message.textContent = text;
        message.className = isError ? "error" : "";
      }

      async function onCredential(response) {
        show("Vérification…");
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ credential: response.credential }),
        });
        if (res.ok) {
          location.replace(target);
        } else {
          const body = await res.json().catch(() => ({}));
          show(body.error || "Connexion refusée.", true);
        }
      }

      async function start() {
        const config = await fetch("/api/auth/config").then((r) => r.json()).catch(() => ({}));
        if (!config.googleClientId) {
          show("Connexion Google pas encore configurée.", true);
          return;
        }
        google.accounts.id.initialize({ client_id: config.googleClientId, callback: onCredential });
        google.accounts.id.renderButton(document.getElementById("button"), {
          theme: "filled_black",
          size: "large",
          shape: "pill",
          text: "signin_with",
          locale: "fr",
        });
      }

      const gsi = document.createElement("script");
      gsi.src = "https://accounts.google.com/gsi/client";
      gsi.async = true;
      gsi.onload = start;
      gsi.onerror = () => show("Impossible de charger la connexion Google.", true);
      document.head.appendChild(gsi);
    </script>
  </body>
</html>
